services:
  db:
    image: postgres:17-alpine
    container_name: fitbase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitbase
      POSTGRES_USER: fitbase
      # Read from backend/.env (docker compose loads it automatically).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    ports:
      # Bound to localhost only: the DB is not reachable from your network.
      # The Android emulator never talks to the DB directly, only to FastAPI.
      - "127.0.0.1:5432:5432"
    volumes:
      - fitbase-pgdata:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbase -d fitbase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitbase-pgdata:
