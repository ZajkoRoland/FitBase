# FitBase - Adatbázis-migrációs konfiguráció (Alembic)

[alembic]
# A migrációs szkriptek helye
script_location = %(here)s/migrations

# Migrációs fájlok elnevezési sablonja (év_hó_nap_óra_perc-rev_név)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Keresési útvonal hozzáadása a python környezethez
prepend_sys_path = .
path_separator = os

# Alapértelmezett URL (az env.py ezt felülírja a .env-ben lévő DATABASE_URL-lel)
sqlalchemy.url = driver://user:pass@localhost/dbname

# Naplózási beállítások
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
